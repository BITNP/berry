name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Checks & Tests
    uses: so1ve/workflows/.github/workflows/conventional-ci.yml@v1
    with:
      node-versions: "24,26"
      runs-on-matrix: '"ubuntu-latest"'
